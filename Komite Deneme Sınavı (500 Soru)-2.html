   if(keys.has(key))continue;keys.add(key);
   qs.push({id:id++,q:"“"+s.t+"” grubuna ait "+(A?"OLMAYAN":"olan")+" hangisidir?",a:c,o:shuf([c,...ot])});
  }
  Q[b]=shuf(qs);
 }
}
